name = "churn-watch-sms-relay"
main = "src/index.ts"
compatibility_date = "2024-09-23"

# Created via: npx wrangler kv namespace create RATE_LIMIT_KV
# Fill in the id below after creating it (see README.md in this folder).
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Secrets (set via `wrangler secret put <NAME>`, never committed):
#   APP_SHARED_SECRET   - shared secret the app must send as the X-App-Secret header
#   TWILIO_ACCOUNT_SID  - Twilio Account SID
#   TWILIO_AUTH_TOKEN   - Twilio Auth Token
#   TWILIO_FROM_NUMBER  - Twilio phone number to send from, E.164 format
#
# Optional plain vars to tune rate limits (defaults: 5 per recipient/day, 50 total/day):
[vars]
MAX_DAILY_PER_RECIPIENT = "5"
MAX_DAILY_TOTAL = "50"
